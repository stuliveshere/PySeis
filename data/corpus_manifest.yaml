    data_type: "stack_2d"
    spec_version: "rev0"
    encoding: "ibm_float"
    endian: "big"
    source_project: "SEG Open Data / Mobil AVO"
    seg_wiki_page: "https://wiki.seg.org/wiki/Mobil_AVO_Viking_Graben_Line_12"
