# SmartSolo (DTCC) — SEG-D Rev1.0 manufacturer-common structural (schema v2)
# Structural overrides on top of rev1.0/base.yaml, common to all SmartSolo
# firmware generations that write SEG-D 1.0 on the wire (currently only version001).
#
# Structural load order:  rev1.0/base.yaml  →  this file  →  versionNNN.yaml
# Mapping load order:     standard.map.yaml  →  versionNNN.map.yaml
#
# GH3 here is SmartSolo-specific: source line/point at the same byte offsets
# as Rev2.1 GH3. The SEG-D 1.0 standard does not define GH3; SmartSolo's
# GH1 byte 12H (additional_gh_blocks) = 2 means GH2 + GH3 on wire.
#
# receiver_geometry (trace-ext block 1) is NOT in this base because the
# Rev1.0 layout differs from Rev2.1 (R_LINE/SRF_SLOC at offset 0, no extended
# fields, no fractional parts). Defined in version001.yaml instead.

manufacturer: SmartSolo
manufacturer_alias: DTCC
code: 0x61
format_codes:
  - 8058

gather_type:
  block: general_header_1
  offset: 23
  nibble: low
  type: bcd_nibble
  values:
    0: SG
    1: RG
    2: CG

blocks:

  # ── SmartSolo General Header 3 — source line/point (32 bytes) ────────────────
  general_header_3:
    number: 3
    size: 32
    replace: true      # SmartSolo owns GH3 entirely (no standard GH3 in Rev1.0)
    fields:
      - name: source_line_int
        offset: 3
        length: 3
        type: int24
        description: "Source line number (integer part)"
        spec_ref: "smartsolo Rev1.0 v1 §GH3"

      - name: source_line_frac
        offset: 6
        length: 2
        type: uint16
        fraction_of: source_line_int
        description: "Source line number fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev1.0 v1 §GH3"

      - name: source_point_int
        offset: 8
        length: 3
        type: int24
        description: "Source point number (integer part)"
        spec_ref: "smartsolo Rev1.0 v1 §GH3"

      - name: source_point_frac
        offset: 11
        length: 2
        type: uint16
        fraction_of: source_point_int
        description: "Source point number fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev1.0 v1 §GH3"

      - name: source_point_index
        offset: 13
        length: 1
        type: uint8
        description: "Source point index (1-9)"
        spec_ref: "smartsolo Rev1.0 v1 §GH3"

  # ── File Extended Header — 32 × 32 = 1024 bytes ──────────────────────────────
  file_extended_header:
    size: 1024
    reserved:
      - { offset: 38, length: 986, note: "SmartSolo uses first 38 bytes; remainder is allocated padding" }
    fields:
      - name: acq_length_ms
        offset: 0
        length: 4
        type: int32
        description: "Acquisition length in milliseconds"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: sample_rate_us
        offset: 4
        length: 4
        type: int32
        description: "Sampling rate in microseconds"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: total_traces
        offset: 8
        length: 4
        type: int32
        description: "Total number of traces in record"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: samples_per_trace
        offset: 12
        length: 4
        type: int32
        description: "Number of samples per trace"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: seismic_traces
        offset: 16
        length: 4
        type: int32
        description: "Number of seismic traces"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: aux_traces
        offset: 20
        length: 4
        type: int32
        description: "Number of auxiliary traces"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: dead_seismic_traces
        offset: 24
        length: 4
        type: int32
        description: "Number of dead seismic traces"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: live_seismic_traces
        offset: 28
        length: 4
        type: int32
        description: "Number of live seismic traces"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: source_type
        offset: 32
        length: 4
        type: int32
        description: "Source type: 0 = no source, 1 = impulsive"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      - name: gather_type_ext
        offset: 36
        length: 2
        type: int16
        values:
          0: sg
          1: rg
          2: cg
        description: "Gather type (duplicates GH1 byte 24L)"
        spec_ref: "smartsolo Rev1.0 §2.1.5"

      # bytes 38-1023: reserved

  # ── External Header — 32 × 32 = 1024 bytes ───────────────────────────────────
  external_header:
    size: 1024
    reserved:
      - { offset: 40, length: 2, note: "spec: not used" }
      - { offset: 46, length: 978, note: "SmartSolo uses first 46 bytes; remainder is allocated padding" }
    fields:
      - name: external_ffid
        offset: 0
        length: 4
        type: int32
        description: "Field file number (external FFID)"
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: file_number
        offset: 4
        length: 4
        type: int32
        description: "File number"
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: source_easting_cm
        offset: 8
        length: 4
        type: int32
        description: "Source easting in cm → m. In RG mode: receiver easting. Null for CG."
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: source_northing_cm
        offset: 12
        length: 4
        type: int32
        description: "Source northing in cm → m. In RG mode: receiver northing. Null for CG."
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: source_elevation_cm
        offset: 16
        length: 4
        type: int32
        description: "Source elevation in cm → m. In RG mode: receiver elevation. Null for CG."
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: gps_lat_int
        offset: 20
        length: 4
        type: int32
        description: "Integer part of source GPS latitude DDMMSS. In RG/CG mode: receiver GPS."
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: gps_lat_frac
        offset: 24
        length: 2
        type: uint16
        fraction_of: gps_lat_int
        description: "Source GPS latitude fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: gps_lon_int
        offset: 26
        length: 4
        type: int32
        description: "Integer part of source GPS longitude DDDMMSS. In RG/CG mode: receiver GPS."
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: gps_lon_frac
        offset: 30
        length: 2
        type: uint16
        fraction_of: gps_lon_int
        description: "Source GPS longitude fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      - name: tb_gps_time_us_ext
        offset: 32
        length: 8
        type: int64
        description: "TB GPS time in microseconds (file-level copy of trace-ext tb_gps.tb_gps_time_us)"
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      # bytes 40-41: not used

      - name: source_gps_height_cm
        offset: 42
        length: 4
        type: int32
        description: "Source GPS height in cm"
        spec_ref: "smartsolo Rev1.0 §2.1.6"

      # bytes 46-1023: reserved

# ── Trace Extension Headers ──────────────────────────────────────────────────
# 7 blocks × 32 bytes = 224 bytes per trace.
trace_extensions:
  count: 7
  block_size: 32
  blocks:

    # receiver_geometry (block 1) is defined per-variant — Rev1.0 differs from Rev2.1.

    # Block 2 — TB GPS time.
    tb_gps:
      number: 2
      fields:
        - name: tb_gps_time_us
          offset: 0
          length: 8
          type: int64
          description: "TB GPS time in microseconds (64-bit)"
          spec_ref: "smartsolo Rev1.0 §trace ext block 2"

        - name: tb_offset_us
          offset: 8
          length: 2
          type: int16
          description: "TB offset in microseconds"
          spec_ref: "smartsolo Rev1.0 §trace ext block 2"

        - name: ffid_trace
          offset: 10
          length: 4
          type: int32
          description: "External FFID per-trace copy; prefer external_header.external_ffid"
          spec_ref: "smartsolo Rev1.0 §trace ext block 2"

        # bytes 14-27: not used

        - name: extended_trace_number
          offset: 28
          length: 4
          type: int32
          description: "Extended trace number (use when demux trace header trace_number = 0xFFFF)"
          spec_ref: "smartsolo Rev1.0 §trace ext block 2"

    # Block 3 — receiver coordinates. No source coordinates in any Rev1.0 variant.
    receiver_coords:
      number: 3
      fields:
        - name: rcvr_easting_cm
          offset: 0
          length: 4
          type: int32
          description: "Receiver easting in cm → m. In RG mode: source easting. 0 for CG."
          spec_ref: "smartsolo Rev1.0 §trace ext block 3"

        - name: rcvr_northing_cm
          offset: 4
          length: 4
          type: int32
          description: "Receiver northing in cm → m. In RG mode: source northing. 0 for CG."
          spec_ref: "smartsolo Rev1.0 §trace ext block 3"

        - name: rcvr_elevation_cm
          offset: 8
          length: 4
          type: int32
          description: "Receiver/source elevation in cm → m."
          spec_ref: "smartsolo Rev1.0 §trace ext block 3"

        # bytes 12-31: reserved

    # Block 4 — IGU GPS.
    igu_gps:
      number: 4
      fields:
        - name: igu_gps_lat_int
          offset: 0
          length: 4
          type: int32
          description: "Integer part of IGU GPS latitude DDMMSS. In RG mode: source GPS."
          spec_ref: "smartsolo Rev1.0 §trace ext block 4"

        - name: igu_gps_lat_frac
          offset: 4
          length: 2
          type: uint16
          fraction_of: igu_gps_lat_int
          description: "IGU GPS latitude fractional part (value = reading / 65535)"
          spec_ref: "smartsolo Rev1.0 §trace ext block 4"

        - name: igu_gps_lon_int
          offset: 6
          length: 4
          type: int32
          description: "Integer part of IGU GPS longitude DDDMMSS. In RG mode: source GPS."
          spec_ref: "smartsolo Rev1.0 §trace ext block 4"

        - name: igu_gps_lon_frac
          offset: 10
          length: 2
          type: uint16
          fraction_of: igu_gps_lon_int
          description: "IGU GPS longitude fractional part (value = reading / 65535)"
          spec_ref: "smartsolo Rev1.0 §trace ext block 4"

        - name: igu_gps_height_m
          offset: 12
          length: 4
          type: float32
          description: "IGU GPS height in metres. In RG mode: source GPS height."
          spec_ref: "smartsolo Rev1.0 §trace ext block 4"

        # bytes 16-31: not used

    # Block 5 is empty in all Rev1.0 variants. Block 7 is empty.

    # Block 6 — node identification.
    node_identification:
      number: 6
      fields:
        - name: unit_type
          offset: 0
          length: 1
          type: uint8
          description: "Unit type"
          spec_ref: "smartsolo Rev1.0 §trace ext block 6"

        - name: unit_serial_number
          offset: 1
          length: 4
          type: int32
          description: "Node unit serial number"
          spec_ref: "smartsolo Rev1.0 §trace ext block 6"

        - name: channel_number
          offset: 5
          length: 1
          type: uint8
          description: "Node channel number. Spec marks type X (may not be populated in all v1 firmware builds)."
          spec_ref: "smartsolo Rev1.0 §trace ext block 6"

        # bytes 6-31: not used
