# Sercel — SEG-D Rev2.1 manufacturer-common ProMAX/SeisSpace map
# Bindings for the Sercel 428XL / Unite v3.0 standard layout defined in
# rev2.1/sercel/standard.yaml.
#
# Map layers contain ONLY `resolvers:` and `mappings:`. No structural keys.
#
# Sercel files don't carry a gather-type indicator — the user picks the
# primary sort via SegdInputProc.OVERRIDE_PRIMARY_SORT. The Tool then
# selects the matching mapping table below (sg, rg, or cg).
#
# Coordinate fields are already in metres (IEEE float in the file), so
# no scale: 0.01 transforms are needed (compare SmartSolo, which stores cm).

# ── Structural concept resolvers (gather-type keyed) ──────────────────────────
resolvers:
  sg:
    ffid:                    general_header_2.expanded_file_number
    sample_interval_micros:  file_extended_header.sample_rate_us
    samples_per_trace:       file_extended_header.samples_per_trace
  rg:
    ffid:                    general_header_2.expanded_file_number
    sample_interval_micros:  file_extended_header.sample_rate_us
    samples_per_trace:       file_extended_header.samples_per_trace
  cg:
    ffid:                    general_header_2.expanded_file_number
    sample_interval_micros:  file_extended_header.sample_rate_us
    samples_per_trace:       file_extended_header.samples_per_trace

# ── ProMAX / SeisSpace import mappings (gather-type keyed) ───────────────────
mappings:
  sg:
    FFID:      general_header_2.expanded_file_number
    CHAN:      demux_trace_header.trace_number
    TRC_TYPE:  channel_set_descriptor.channel_type
    SCANTYPE:  channel_set_descriptor.scan_type_number
    CHAN_SET:  channel_set_descriptor.channel_set_number
    NUMSMP:    file_extended_header.samples_per_trace
    SAMPRT:    file_extended_header.sample_rate_us       # already microseconds
    S_LINE:    general_header_3.source_line_int
    SOU_SLOC:  general_header_3.source_point_int
    R_LINE:    receiver_geometry.receiver_line_number
    SRF_SLOC:  receiver_geometry.receiver_point_number
    SOU_XD:    file_extended_header.source_easting       # already metres
    SOU_YD:    file_extended_header.source_northing
    SOU_ELEV:  file_extended_header.source_elevation
    REC_XD:    receiver_coords.receiver_easting
    REC_YD:    receiver_coords.receiver_northing
    REC_ELEV:  receiver_coords.receiver_elevation
    AOFFSET:   control_unit.seismic_trace_offset
    TLIVE_S:   channel_set_descriptor.channel_set_start_time
    TFULL_S:   channel_set_descriptor.channel_set_end_time

  rg:
    # Receiver-gather: swap the source/receiver semantics. In a Sercel RG
    # file, the "source" coords in the file_extended_header still describe
    # the source point that was active when this gather was assembled, and
    # the receiver_coords block still describes the trace's physical
    # receiver — so coordinate plumbing stays the same as SG. What changes
    # is line/point: the GH3 source_line/source_point pair becomes the
    # receiver-gather's RECEIVER identity, and the trace's
    # receiver_geometry becomes the SOURCE identity. (Mirrors the
    # smartsolo Rev2.1 RG convention.)
    FFID:      general_header_2.expanded_file_number
    CHAN:      demux_trace_header.trace_number
    TRC_TYPE:  channel_set_descriptor.channel_type
    SCANTYPE:  channel_set_descriptor.scan_type_number
    CHAN_SET:  channel_set_descriptor.channel_set_number
    NUMSMP:    file_extended_header.samples_per_trace
    SAMPRT:    file_extended_header.sample_rate_us
    R_LINE:    general_header_3.source_line_int
    SRF_SLOC:  general_header_3.source_point_int
    S_LINE:    receiver_geometry.receiver_line_number
    SOU_SLOC:  receiver_geometry.receiver_point_number
    SOU_XD:    file_extended_header.source_easting
    SOU_YD:    file_extended_header.source_northing
    SOU_ELEV:  file_extended_header.source_elevation
    REC_XD:    receiver_coords.receiver_easting
    REC_YD:    receiver_coords.receiver_northing
    REC_ELEV:  receiver_coords.receiver_elevation
    AOFFSET:   control_unit.seismic_trace_offset
    TLIVE_S:   channel_set_descriptor.channel_set_start_time
    TFULL_S:   channel_set_descriptor.channel_set_end_time

  cg:
    # Continuous gather — neither source nor receiver concept applies.
    # Identity + timing only; coordinate plumbing suppressed.
    FFID:      general_header_2.expanded_file_number
    CHAN:      demux_trace_header.trace_number
    TRC_TYPE:  channel_set_descriptor.channel_type
    SCANTYPE:  channel_set_descriptor.scan_type_number
    CHAN_SET:  channel_set_descriptor.channel_set_number
    NUMSMP:    file_extended_header.samples_per_trace
    SAMPRT:    file_extended_header.sample_rate_us
    TLIVE_S:   channel_set_descriptor.channel_set_start_time
    TFULL_S:   channel_set_descriptor.channel_set_end_time
