# Default Mapping: SEGY Header Code -> SeisData Column Name

# Trace Identification
fldr: file_number
shot_number: shot_number
tracf: channel_number
ep: source_index
cdp: cdp
cdpt: cdp_trace_number
trid: trace_code
offset: offset

# Coordinates
sx: source_x
sy: source_y
gx: receiver_x
gy: receiver_y
counit: coordinate_units

# Elevations & Geometry
gelev: receiver_elevation
selev: source_elevation
sdepth: source_depth
scalel: elevation_scalar
scalco: coordinate_scalar

# Time / Samples
ns: num_samples
dt: sample_rate
delrt: recording_delay
mute: mute_end
muts: mute_start

# Statics
sstat: source_static
gstat: receiver_static
tstat: total_static

# Quality & Weights
trwf: trace_weighting_factor
