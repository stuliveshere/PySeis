# SmartSolo firmware gen Rev3.1, spec document v1 — SEG-D 3.1 on wire
# Reference: SmartSolo SEGD Format Rev3.1 Description v1
#            javadocs/segd/SmartSolo_segd_format_Rev3.1_description_v1.pdf
#
# AUTO-DETECTED: GH2 byte 11 = unsigned binary 3 (major revision).
#
# Distinguishing wire features:
#   - 9 GH blocks (GH1 through GH9; additional_gh_blocks = 8). Standard
#     Rev3.1 GH3 = Timestamp; SmartSolo repurposes standard GH8 (Line ID)
#     for Source Description — see general_header_8 below with replace:true.
#   - All 7 trace-extension blocks are manufacturer-defined in Rev3.1.

id: version001

firmware_labels:
  - id: fw3.1_v1
    operator_label: "SmartSolo firmware Rev3.1 spec v1"

version_signal:
  block: general_header_2
  offset: 10                  # spec byte 11 = major revision byte
  length: 1
  type: uint8
  value: 3

blocks:

  # ── SmartSolo General Header 8 — Source Description (32 bytes) ────────────────
  # Standard Rev3.1 GH8 is a Line Identification block; SmartSolo fully replaces
  # it with source line/point fields at the same byte offsets as Rev2.1 GH3.
  general_header_8:
    number: 8
    size: 32
    replace: true              # discard standard Line-ID fields entirely
    fields:
      - name: source_line_int
        offset: 3              # GH8 bytes 4-6
        length: 3
        type: int24
        description: "Source line number (integer part). GH8 in Rev3.1; was GH3 in Rev2.1."
        spec_ref: "smartsolo Rev3.1 v1 §GH8"

      - name: source_line_frac
        offset: 6              # GH8 bytes 7-8
        length: 2
        type: uint16
        fraction_of: source_line_int
        description: "Source line number fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev3.1 v1 §GH8"

      - name: source_point_int
        offset: 8              # GH8 bytes 9-11
        length: 3
        type: int24
        description: "Source point number (integer part)"
        spec_ref: "smartsolo Rev3.1 v1 §GH8"

      - name: source_point_frac
        offset: 11             # GH8 bytes 12-13
        length: 2
        type: uint16
        fraction_of: source_point_int
        description: "Source point number fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev3.1 v1 §GH8"

      - name: source_point_index
        offset: 13             # GH8 byte 14
        length: 1
        type: uint8
        description: "Source point index (1-9)"
        spec_ref: "smartsolo Rev3.1 v1 §GH8"

      # byte 31: standard Rev3.1 header_block_type sentinel = 0x14 for Line ID
      # (overwritten with SmartSolo content under replace:true)

trace_extensions:
  blocks:

    # Block 1 — receiver geometry. R_LINE/SRF_SLOC at offsets 10 and 15 as in
    # Rev2.1 v2, plus Rev3.1-new fields: sensor_type, extended_trace_number,
    # samples_per_trace, sensor_moving.
    receiver_geometry:
      number: 1
      fields:
        # bytes 0-5: not used (0xFFFFFF short sentinels)

        - name: rcvr_source_point_index
          offset: 6
          length: 1
          type: int8
          description: "Receiver/source point index"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: reshoot_index
          offset: 7
          length: 1
          type: uint8
          description: "Re-shoot index"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: group_index
          offset: 8
          length: 1
          type: uint8
          description: "Group index"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: depth_index
          offset: 9
          length: 1
          type: uint8
          description: "Depth index"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: rcvr_line_int
          offset: 10
          length: 3
          type: int24
          description: "Integer part of extended receiver line number. In RG mode: source line. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: rcvr_line_frac
          offset: 13
          length: 2
          type: uint16
          fraction_of: rcvr_line_int
          description: "Fractional part of receiver/source line number (value = reading / 65535)"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: rcvr_point_int
          offset: 15
          length: 3
          type: int24
          description: "Integer part of extended receiver point number. In RG mode: source point. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: rcvr_point_frac
          offset: 18
          length: 2
          type: uint16
          fraction_of: rcvr_point_int
          description: "Fractional part of receiver/source point number (value = reading / 65535)"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: sensor_type
          offset: 20
          length: 1
          type: uint8
          description: "Sensor type recorded on this trace"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: extended_trace_number
          offset: 21
          length: 3
          type: int24
          description: "Extended trace number (use when demux trace header trace_number = 0xFFFF)"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: samples_per_trace
          offset: 24
          length: 4
          type: int32
          description: "Number of samples in this trace"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        - name: sensor_moving
          offset: 28
          length: 1
          type: uint8
          description: "Sensor moving flag (0 = stationary)"
          spec_ref: "smartsolo Rev3.1 v1 §block 1"

        # byte 30: physical unit; byte 31: header_block_type = 0x40

    # Block 2 — Sensor Info (NEW in Rev3.1).
    sensor_info:
      number: 2
      fields:
        - name: equipment_test_time
          offset: 0
          length: 8
          type: int64
          description: "Equipment test time (SEG-D 8-byte timestamp)"
          spec_ref: "smartsolo Rev3.1 v1 §block 2"

        - name: sensor_sensitivity
          offset: 8
          length: 4
          type: ieee_float
          description: "Sensor sensitivity (32-bit IEEE float)"
          spec_ref: "smartsolo Rev3.1 v1 §block 2"

        - name: equipment_test_result
          offset: 12
          length: 1
          type: uint8
          values:
            0: untested
            1: failed
            2: passed
            3: uncertain
          description: "Equipment test result"
          spec_ref: "smartsolo Rev3.1 v1 §block 2"

        - name: sensor_serial_ascii
          offset: 13
          length: 18
          type: ascii
          description: "Sensor serial number (18 ASCII chars)"
          spec_ref: "smartsolo Rev3.1 v1 §block 2"

        # byte 31: header_block_type = 0x41

    # Block 3 — TB GPS timestamp (per-trace). Same role as Rev2.1 block 2; moved
    # from block 2 to block 3 to make room for Rev3.1 Sensor Info.
    tb_gps:
      number: 3
      fields:
        - name: tb_gps_time_us
          offset: 0
          length: 8
          type: int64
          description: "TB GPS time in microseconds (per-trace Time Zero)"
          spec_ref: "smartsolo Rev3.1 v1 §block 3"

        # bytes 8-30: undefined; byte 31: header_block_type = 0x42

    # Block 4 — Time Drift (NEW in Rev3.1; Rev2.1 used this block for IGU GPS).
    time_drift:
      number: 4
      fields:
        - name: time_of_deployment
          offset: 0
          length: 8
          type: int64
          description: "Time of deployment (SEG-D 8-byte timestamp)"
          spec_ref: "smartsolo Rev3.1 v1 §block 4"

        - name: time_of_retrieval
          offset: 8
          length: 8
          type: int64
          description: "Time of retrieval (SEG-D 8-byte timestamp)"
          spec_ref: "smartsolo Rev3.1 v1 §block 4"

        - name: time_offset_at_deployment
          offset: 16
          length: 4
          type: int32
          description: "Time offset at deployment (signed binary)"
          spec_ref: "smartsolo Rev3.1 v1 §block 4"

        - name: time_offset_at_retrieval
          offset: 20
          length: 4
          type: int32
          description: "Time offset at retrieval (signed binary)"
          spec_ref: "smartsolo Rev3.1 v1 §block 4"

        - name: time_drift_corrected
          offset: 24
          length: 1
          type: uint8
          values:
            0: not_corrected
            1: corrected
          description: "Time drift corrected flag"
          spec_ref: "smartsolo Rev3.1 v1 §block 4"

        - name: time_drift_correction_method
          offset: 25
          length: 1
          type: uint8
          values:
            0x00: uncorrected
            0x01: linear_corrected
            0xFF: other
          description: "Correction method"
          spec_ref: "smartsolo Rev3.1 v1 §block 4"

        # bytes 26-30: undefined; byte 31: header_block_type = 0x44

    # Block 5 — Orientation (NEW in Rev3.1; empty in Rev2.1).
    orientation:
      number: 5
      fields:
        - name: rotation_x
          offset: 0
          length: 4
          type: ieee_float
          description: "Rotation angle around X axis in radians"
          spec_ref: "smartsolo Rev3.1 v1 §block 5"

        - name: rotation_y
          offset: 4
          length: 4
          type: ieee_float
          description: "Rotation angle around Y axis in radians"
          spec_ref: "smartsolo Rev3.1 v1 §block 5"

        - name: rotation_z
          offset: 8
          length: 4
          type: ieee_float
          description: "Rotation angle around Z axis in radians"
          spec_ref: "smartsolo Rev3.1 v1 §block 5"

        - name: reference_orientation
          offset: 12
          length: 4
          type: ieee_float
          description: "Reference orientation"
          spec_ref: "smartsolo Rev3.1 v1 §block 5"

        - name: orientation_timestamp
          offset: 16
          length: 8
          type: float64
          description: "Timestamp for which the rotation applies (8-byte IEEE double)"
          spec_ref: "smartsolo Rev3.1 v1 §block 5"

        # bytes 24-30: orientation flags; byte 31: header_block_type = 0x60

    # Block 6 — receiver/source coordinates. Same role as Rev2.1 block 3 (with
    # source coords from rev2.1 version002) but here at block number 6. Source coords are
    # always present in Rev3.1 — not a variant option.
    receiver_coords:
      number: 6
      fields:
        - name: rcvr_easting_cm
          offset: 0
          length: 4
          type: int32
          description: "Receiver easting in cm → m. In RG mode: source easting. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 6"

        - name: rcvr_northing_cm
          offset: 4
          length: 4
          type: int32
          description: "Receiver northing in cm → m. In RG mode: source northing. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 6"

        - name: rcvr_elevation_cm
          offset: 8
          length: 4
          type: int32
          description: "Receiver/source elevation in cm → m."
          spec_ref: "smartsolo Rev3.1 v1 §block 6"

        - name: source_easting_cm_trace
          offset: 12
          length: 4
          type: int32
          description: "Source file easting in cm. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 6"

        - name: source_northing_cm_trace
          offset: 16
          length: 4
          type: int32
          description: "Source file northing in cm. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 6"

        - name: source_elevation_cm_trace
          offset: 20
          length: 4
          type: int32
          description: "Source file elevation in cm. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 6"

        # bytes 24-30: not used; byte 31: header_block_type = 0xb0

    # Block 7 — two roles share this block number. Rev3.1 physically carries
    # IGU GPS + node identification + per-trace FFID in a single 32-byte block,
    # but the roles are kept separate (non-overlapping byte ranges) so the
    # reader can look up `igu_gps` and `node_identification` by role in any
    # revision. See README "Multiple roles per number:".

    igu_gps:
      number: 7
      fields:
        - name: igu_gps_lat_int
          offset: 0
          length: 4
          type: int32
          description: "Integer part of IGU GPS latitude DDMMSS. In RG mode: source GPS. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 7"

        - name: igu_gps_lat_frac
          offset: 4
          length: 2
          type: uint16
          fraction_of: igu_gps_lat_int
          description: "IGU GPS latitude fractional part (value = reading / 65535)"
          spec_ref: "smartsolo Rev3.1 v1 §block 7"

        - name: igu_gps_lon_int
          offset: 6
          length: 4
          type: int32
          description: "Integer part of IGU GPS longitude DDDMMSS. In RG mode: source GPS. 0 for CG."
          spec_ref: "smartsolo Rev3.1 v1 §block 7"

        - name: igu_gps_lon_frac
          offset: 10
          length: 2
          type: uint16
          fraction_of: igu_gps_lon_int
          description: "IGU GPS longitude fractional part (value = reading / 65535)"
          spec_ref: "smartsolo Rev3.1 v1 §block 7"

        - name: igu_gps_height_m
          offset: 12
          length: 4
          type: ieee_float
          description: "IGU GPS height in metres. In RG mode: source GPS height."
          spec_ref: "smartsolo Rev3.1 v1 §block 7"

    node_identification:
      number: 7
      fields:
        - name: unit_serial_number
          offset: 16
          length: 4
          type: int32
          description: "IGU node serial number (at offset 16; contrast Rev2.1 block 6 offset 1)"
          spec_ref: "smartsolo Rev3.1 v1 §block 7"

        - name: external_ffid_trace
          offset: 20
          length: 4
          type: int32
          description: "External FFID per-trace copy; prefer external_header.external_ffid"
          spec_ref: "smartsolo Rev3.1 v1 §block 7"

        # bytes 24-30: not used; byte 31: header_block_type = 0xb1

    # channel_number (CHAN) is not present in Rev3.1 SmartSolo trace extensions;
    # CHAN comes from channel_set_descriptor in the standard Rev3.1 schema.
