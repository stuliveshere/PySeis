# SmartSolo (DTCC) — SEG-D Rev2.1 manufacturer-common structural (schema v2)
# Structural overrides on top of rev2.1/base.yaml, common to all SmartSolo
# firmware generations that write SEG-D 2.1 on the wire (fw 1.0 v2, 2.1 v1, 2.1 v2).
#
# Structural load order:  rev2.1/base.yaml  →  this file  →  versionNNN.yaml
# Mapping load order:     standard.map.yaml  →  versionNNN.map.yaml
#
# Structural layers own `blocks:`, `trace_extensions:`, `gather_type:`,
# `version_signal:`. ProMAX/SeisSpace bindings live in the paired .map.yaml
# files, never here.
#
# GH3 here is SmartSolo-specific: source line/point at the same byte offsets
# across all three Rev2.1-on-wire firmware variants. (In SEG-D Rev3.1 GH3
# is a standard Timestamp block — that's why this lives in the rev2.1 layer.)
# GH1 byte 12H (additional_gh_blocks) = 2 → GH2 + GH3 present on wire.

manufacturer: SmartSolo
manufacturer_alias: DTCC
code: 0x61
format_codes:
  - 8058

gather_type:
  block: general_header_1
  offset: 23                 # spec byte 24 LOW nibble — SmartSolo extension
  nibble: low
  type: bcd_nibble
  values:
    0: SG
    1: RG
    2: CG

# ── Structural block augmentations ────────────────────────────────────────────
# Adds manufacturer-specific fields referenced by the paired .map.yaml files.
# Field-level merge with rev2.1/base.yaml extends standard blocks where needed
# (mp_factor, gain_control_method are added to channel_set_descriptor).
blocks:

  # mp_factor + gain_control_method are SmartSolo import targets; channel_type
  # is already declared in rev2.1/base.yaml.
  channel_set_descriptor:
    fields:
      - name: mp_factor
        offset: 7                # spec byte 8; sign-magnitude binary exponent
        length: 1
        type: int8
        description: "MP factor exponent (sign-magnitude); descale multiplier = 2^mp_factor"
        spec_ref: "rev2.1 §8.3 p.45"

      - name: gain_control_method
        offset: 11               # spec byte 12, LOW nibble
        nibble: low
        type: bcd_nibble
        values:
          0x1: individual_agc
          0x2: ganged_agc
          0x3: fixed_gain
          0x4: programmed_gain
          0x8: binary_gain
          0x9: ifp_gain
        description: "Gain control method"
        spec_ref: "rev2.1 §8.3 p.45"

  # ── SmartSolo General Header 3 — source line/point (32 bytes) ────────────────
  general_header_3:
    number: 3
    size: 32
    replace: true      # fully owned by SmartSolo on Rev2.1 wire (no standard GH3 in Rev2.1)
    fields:
      - name: source_line_int
        offset: 3                # GH3 bytes 4-6
        length: 3
        type: int24
        description: "Source line number (integer part)"
        spec_ref: "smartsolo Rev2.1 v2 §GH3"

      - name: source_line_frac
        offset: 6                # GH3 bytes 7-8
        length: 2
        type: uint16
        description: "Source line number fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev2.1 v2 §GH3"

      - name: source_point_int
        offset: 8                # GH3 bytes 9-11
        length: 3
        type: int24
        description: "Source point number (integer part)"
        spec_ref: "smartsolo Rev2.1 v2 §GH3"

      - name: source_point_frac
        offset: 11               # GH3 bytes 12-13
        length: 2
        type: uint16
        description: "Source point number fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev2.1 v2 §GH3"

      - name: source_point_index
        offset: 13               # GH3 byte 14
        length: 1
        type: uint8
        description: "Source point index (1-9)"
        spec_ref: "smartsolo Rev2.1 v2 §GH3"

  # ── File Extended Header — 32 × 32 = 1024 bytes ──────────────────────────────
  # Authoritative per-record sample rate and sample count live here
  # (SmartSolo doesn't populate GH1.base_scan_interval reliably).
  # Identical layout across all three Rev2.1-on-wire SmartSolo variants.
  file_extended_header:
    size: 1024
    reserved:
      - { offset: 38, length: 986, note: "SmartSolo uses first 38 bytes; remainder is allocated padding" }
    fields:
      - name: acq_length_ms
        offset: 0
        length: 4
        type: int32
        description: "Acquisition length in milliseconds"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: sample_rate_us
        offset: 4
        length: 4
        type: int32
        description: "Sampling rate in microseconds (canonical)"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: total_traces
        offset: 8
        length: 4
        type: int32
        description: "Total number of traces in record"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: samples_per_trace
        offset: 12
        length: 4
        type: int32
        description: "Number of samples per trace (canonical)"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: seismic_traces
        offset: 16
        length: 4
        type: int32
        description: "Number of seismic traces"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: aux_traces
        offset: 20
        length: 4
        type: int32
        description: "Number of auxiliary traces"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: dead_seismic_traces
        offset: 24
        length: 4
        type: int32
        description: "Number of dead seismic traces"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: live_seismic_traces
        offset: 28
        length: 4
        type: int32
        description: "Number of live seismic traces"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: source_type
        offset: 32
        length: 4
        type: int32
        description: "Source type: 0 = no source, 1 = impulsive"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

      - name: gather_type_ext
        offset: 36
        length: 2
        type: int16
        values:
          0: sg
          1: rg
          2: cg
        description: "Gather type (duplicates GH1 byte 24L)"
        spec_ref: "smartsolo Rev2.1 §2.1.5"

  # ── External Header — 32 × 32 = 1024 bytes ───────────────────────────────────
  # Bytes 0-45 are common to all three Rev2.1-on-wire variants.
  # version002.yaml appends SPS X/Y/Z at bytes 46-57 via field-level merge.
  external_header:
    size: 1024
    reserved:
      - { offset: 40, length: 2, note: "spec: not used" }
      - { offset: 46, length: 978, note: "base leaves 46-1023 empty; version002 claims 46-57 for SPS" }
    fields:
      - name: external_ffid
        offset: 0
        length: 4
        type: int32
        description: "Field file number (external FFID)"
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: file_number
        offset: 4
        length: 4
        type: int32
        description: "File number"
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: source_easting_cm
        offset: 8
        length: 4
        type: int32
        description: "Source easting in cm → m. In RG mode: receiver easting. Null for CG."
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: source_northing_cm
        offset: 12
        length: 4
        type: int32
        description: "Source northing in cm → m. In RG mode: receiver northing. Null for CG."
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: source_elevation_cm
        offset: 16
        length: 4
        type: int32
        description: "Source elevation in cm → m. In RG mode: receiver elevation. Null for CG."
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: gps_lat_int
        offset: 20
        length: 4
        type: int32
        description: "Integer part of source GPS latitude DDMMSS. In RG/CG mode: receiver GPS."
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: gps_lat_frac
        offset: 24
        length: 2
        type: uint16
        description: "Source GPS latitude fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: gps_lon_int
        offset: 26
        length: 4
        type: int32
        description: "Integer part of source GPS longitude DDDMMSS. In RG/CG mode: receiver GPS."
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: gps_lon_frac
        offset: 30
        length: 2
        type: uint16
        description: "Source GPS longitude fractional part (value = reading / 65535)"
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      - name: tb_gps_time_us_ext
        offset: 32
        length: 8
        type: int64
        description: "TB GPS time in microseconds (file-level copy of trace-ext block_2.tb_gps_time_us)"
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      # bytes 40-41: not used

      - name: source_gps_height_cm
        offset: 42
        length: 4
        type: int32
        description: "Source GPS height in cm"
        spec_ref: "smartsolo Rev2.1 §2.1.6"

      # bytes 46-1023: reserved in base; version002.yaml appends SPS X/Y/Z at 46-57

# ── Trace Extension Headers ──────────────────────────────────────────────────
# 7 blocks × 32 bytes = 224 bytes per trace.
trace_extensions:
  count: 7
  block_size: 32
  blocks:

    # Block 1 — receiver geometry (extended layout).
    # Short receiver line/point at offsets 0-5 with 0xFFFFFF sentinel (documented
    # but not mapped). Extended INT+FRAC at offsets 10-19 is authoritative.
    receiver_geometry:
      number: 1
      fields:
        - name: rcvr_line_short
          offset: 0
          length: 3
          type: int24
          description: "Short receiver line number (0xFFFFFF = use extended at offset 10)."
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        - name: rcvr_point_short
          offset: 3
          length: 3
          type: int24
          description: "Short receiver point number (0xFFFFFF = use extended at offset 15)."
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        - name: rcvr_source_point_index
          offset: 6
          length: 1
          type: uint8
          description: "Receiver/source point index"
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        - name: samples_per_trace
          offset: 7
          length: 3
          type: int24
          description: "Number of samples per trace (per-trace copy)"
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        - name: rcvr_line_int
          offset: 10
          length: 3
          type: int24
          description: "Integer part of extended receiver line number. In RG mode: source line. 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        - name: rcvr_line_frac
          offset: 13
          length: 2
          type: uint16
          description: "Fractional part of receiver line number (value = reading / 65535)."
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        - name: rcvr_point_int
          offset: 15
          length: 3
          type: int24
          description: "Integer part of extended receiver point number. In RG mode: source point. 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        - name: rcvr_point_frac
          offset: 18
          length: 2
          type: uint16
          description: "Fractional part of receiver point number (value = reading / 65535)."
          spec_ref: "smartsolo Rev2.1 §trace ext block 1"

        # bytes 20-31: not used

    # Block 2 — TB GPS time. Common to all Rev1.0 and Rev2.1 SmartSolo variants.
    tb_gps:
      number: 2
      fields:
        - name: tb_gps_time_us
          offset: 0
          length: 8
          type: int64
          description: "TB GPS time in microseconds (64-bit)"
          spec_ref: "smartsolo Rev2.1 §trace ext block 2"

        - name: tb_offset_us
          offset: 8
          length: 2
          type: int16
          description: "TB offset in microseconds"
          spec_ref: "smartsolo Rev2.1 §trace ext block 2"

        - name: ffid_trace
          offset: 10
          length: 4
          type: int32
          description: "External FFID per-trace copy; prefer external_header.external_ffid"
          spec_ref: "smartsolo Rev2.1 §trace ext block 2"

        # bytes 14-27: not used

        - name: extended_trace_number
          offset: 28
          length: 4
          type: int32
          description: "Extended trace number (use when demux trace header trace_number = 0xFFFF)"
          spec_ref: "smartsolo Rev2.1 §trace ext block 2"

    # Block 3 — receiver coordinates + universal source coords (common across
    # all Rev2.1 variants). Bytes 0-11 swap meaning per gather type
    # (receiver in SG, source in RG, 0 in CG); bytes 12-23 always carry the
    # "source file" coords when populated, regardless of gather type — that
    # is what the RG mapping reads since recorders frequently leave the
    # bytes-0-11 RG-source slot at 0 and put source in 12-23 instead.
    receiver_coords:
      number: 3
      fields:
        - name: rcvr_easting_cm
          offset: 0
          length: 4
          type: int32
          description: "Receiver easting in cm → m. In RG mode: source easting (or 0 — recorder may use source_file_easting_cm at offset 12 instead). 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 3"

        - name: rcvr_northing_cm
          offset: 4
          length: 4
          type: int32
          description: "Receiver northing in cm → m. In RG mode: source northing (or 0 — recorder may use source_file_northing_cm at offset 16 instead). 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 3"

        - name: rcvr_elevation_cm
          offset: 8
          length: 4
          type: int32
          description: "Receiver/source elevation in cm → m. 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 3"

        - name: source_file_easting_cm
          offset: 12
          length: 4
          type: int32
          description: "Source easting in cm → m (always source, regardless of gather type). 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 3"

        - name: source_file_northing_cm
          offset: 16
          length: 4
          type: int32
          description: "Source northing in cm → m (always source, regardless of gather type). 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 3"

        - name: source_file_elevation_cm
          offset: 20
          length: 4
          type: int32
          description: "Source elevation in cm → m (always source, regardless of gather type). 0 for CG."
          spec_ref: "smartsolo Rev2.1 §trace ext block 3"

        # bytes 24-31: reserved

    # Block 4 — IGU GPS location. Common to all Rev2.1 variants.
    igu_gps:
      number: 4
      fields:
        - name: igu_gps_lat_int
          offset: 0
          length: 4
          type: int32
          description: "Integer part of IGU GPS latitude DDMMSS. In RG mode: source GPS."
          spec_ref: "smartsolo Rev2.1 §trace ext block 4"

        - name: igu_gps_lat_frac
          offset: 4
          length: 2
          type: uint16
          description: "IGU GPS latitude fractional part (value = reading / 65535)"
          spec_ref: "smartsolo Rev2.1 §trace ext block 4"

        - name: igu_gps_lon_int
          offset: 6
          length: 4
          type: int32
          description: "Integer part of IGU GPS longitude DDDMMSS. In RG mode: source GPS."
          spec_ref: "smartsolo Rev2.1 §trace ext block 4"

        - name: igu_gps_lon_frac
          offset: 10
          length: 2
          type: uint16
          description: "IGU GPS longitude fractional part (value = reading / 65535)"
          spec_ref: "smartsolo Rev2.1 §trace ext block 4"

        - name: igu_gps_height_m
          offset: 12
          length: 4
          type: float32
          description: "IGU GPS height in metres. In RG mode: source GPS height."
          spec_ref: "smartsolo Rev2.1 §trace ext block 4"

        # bytes 16-31: not used

    # Block 5 (number 5) is empty across all Rev2.1 SmartSolo variants.
    # Block 7 (number 7) is empty across all Rev2.1 SmartSolo variants.

    # Block 6 — node identification. Common to all Rev2.1 variants.
    node_identification:
      number: 6
      fields:
        - name: unit_type
          offset: 0
          length: 1
          type: uint8
          description: "Unit type"
          spec_ref: "smartsolo Rev2.1 §trace ext block 6"

        - name: unit_serial_number
          offset: 1
          length: 4
          type: int32
          description: "Node unit serial number"
          spec_ref: "smartsolo Rev2.1 §trace ext block 6"

        - name: channel_number
          offset: 5
          length: 1
          type: uint8
          description: "Node channel number"
          spec_ref: "smartsolo Rev2.1 §trace ext block 6"

        # bytes 6-31: not used
