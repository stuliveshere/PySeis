# Sercel — SEG-D Rev1.0 manufacturer-common structural (schema v2)
# Reference: javadocs/segd/428_standards.pdf — Sercel 428XL User's Manual Vol. 2
#            Chapter 1 = byte-level format. The chapter title says "SEGD format
#            (Rev. 1)" and explicitly covers both 428XL and Unite recorders.
#            Rev 2.1 (Chapter 2) only changes the SEG-D Revision Number byte
#            and adds a tape-label block — block byte layouts are unchanged.
#
# Structural load order:  rev1.0/base.yaml  →  this file  →  versionNNN.yaml
# Mapping load order:     standard.map.yaml  →  versionNNN.map.yaml
#
# Differences vs. rev2.1/sercel/standard.yaml:
#   - GH2 revision bytes 11-12 are BCD here (0x01, 0x00) vs. binary in Rev2.1.
#     Handled by SegdReader.lookup() — keys on raw byte values where 0-9 are
#     identical under both encodings.
#   - GH2 sequence_number (bytes 21-22) absent in Rev1.0 — not used in our
#     mappings either way.
#   - channel_set_descriptor.channel_type values {1=seis, 9=aux} are already
#     the Rev1.0 base default (Sercel uses the same codes), so no override
#     needed here. (Compare rev2.1/base which uses 0xC for aux and needs the
#     manufacturer layer to swap in 9.)
#
# Sercel files don't carry a self-identifying gather-type byte; gather_type
# section deliberately omitted, defaulting reader to SG. Users override via
# SegdInputProc.OVERRIDE_PRIMARY_SORT.

manufacturer: Sercel
manufacturer_alias: Sercel428XL_Unite
code: 0x13
format_codes:
  - 8058

# ── Structural block augmentations ────────────────────────────────────────────
blocks:

  # ── Sercel General Header 3 — source line/point (32 bytes) ───────────────────
  # Identical layout to Rev2.1: bytes 4-8 = source line, 9-13 = source point
  # (each 5-byte int.frac: 3-byte uint integer + 2-byte uint fraction-of-65536).
  general_header_3:
    number: 3
    size: 32
    replace: true
    fields:
      - name: expanded_file_number
        offset: 0                # GH3 bytes 1-3
        length: 3
        type: uint24
        description: "Expanded file number (use when GH1 file_number = 0xFFFF)"
        spec_ref: "428XL Vol.2 §1 p.20"

      - name: source_line_int
        offset: 3                # GH3 bytes 4-6
        length: 3
        type: uint24
        description: "Source line number (integer part)"
        spec_ref: "428XL Vol.2 §1 p.20"

      - name: source_line_frac
        offset: 6                # GH3 bytes 7-8
        length: 2
        type: uint16
        description: "Source line number fractional part (value = reading / 65536)"
        spec_ref: "428XL Vol.2 §1 p.20"

      - name: source_point_int
        offset: 8                # GH3 bytes 9-11
        length: 3
        type: uint24
        description: "Source point number (integer part)"
        spec_ref: "428XL Vol.2 §1 p.20"

      - name: source_point_frac
        offset: 11               # GH3 bytes 12-13
        length: 2
        type: uint16
        description: "Source point number fractional part (value = reading / 65536)"
        spec_ref: "428XL Vol.2 §1 p.20"

      - name: source_point_index
        offset: 13               # GH3 byte 14
        length: 1
        type: uint8
        description: "Source point index (1-9)"
        spec_ref: "428XL Vol.2 §1 p.20"

      - name: source_set_number
        offset: 19               # GH3 byte 20
        length: 1
        type: uint8
        description: "Source set number"
        spec_ref: "428XL Vol.2 §1 p.20"

  # ── File Extended Header — 32 × 32 = 1024 bytes ──────────────────────────────
  # Same layout as Rev2.1 (the 428 doc lists Extended-Header bytes the same in
  # both chapters; only Rev2.1 adds the tape-label storage-unit structure
  # outside the SEG-D file itself, which doesn't affect block bytes).
  file_extended_header:
    size: 1024
    reserved:
      - { offset: 596, length: 428, note: "Sercel firmware-version-specific bytes (873-948 range); not required for Phase B import" }
    fields:
      - { name: acquisition_length_ms, offset: 0,   length: 4, type: uint32, description: "Acquisition length in milliseconds",    spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: sample_rate_us,        offset: 4,   length: 4, type: uint32, description: "Sample rate in microseconds",           spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: total_traces,          offset: 8,   length: 4, type: uint32, description: "Total number of traces",                spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: aux_traces,            offset: 12,  length: 4, type: uint32, description: "Number of auxiliary traces",            spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: seismic_traces,        offset: 16,  length: 4, type: uint32, description: "Number of seismic traces",              spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: dead_seismic_traces,   offset: 20,  length: 4, type: uint32, description: "Number of dead seismic traces",         spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: live_seismic_traces,   offset: 24,  length: 4, type: uint32, description: "Number of live seismic traces",         spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: source_type,           offset: 28,  length: 4, type: uint32, description: "Source type: 0=none, 1=impulsive, 2=vibro", spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: samples_per_trace,     offset: 32,  length: 4, type: uint32, description: "Number of samples in trace",            spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: shot_number,           offset: 36,  length: 4, type: uint32, description: "Shot number (1-9999)",                  spec_ref: "428XL Vol.2 §1 p.23" }
      - { name: record_length_ms,      offset: 484, length: 4, type: uint32, description: "Record length in milliseconds",         spec_ref: "428XL Vol.2 §1 p.26" }
      - { name: source_easting,        offset: 572, length: 8, type: float64, description: "Source easting (metres). Defaults to GUI setup or updated by navigation.", spec_ref: "428XL Vol.2 §1 p.26" }
      - { name: source_northing,       offset: 580, length: 8, type: float64, description: "Source northing (metres). Defaults to GUI setup or updated by navigation.", spec_ref: "428XL Vol.2 §1 p.26" }
      - { name: source_elevation,      offset: 588, length: 4, type: float32, description: "Source elevation (metres). Defaults to GUI setup or updated by navigation.", spec_ref: "428XL Vol.2 §1 p.26" }

  # ── External Header — variable-size ASCII free-text ──────────────────────────
  external_header:
    size: 1024
    reserved:
      - { offset: 0, length: 1024, note: "Free-text ASCII; not parsed at schema level" }

# ── Trace Extension Headers ──────────────────────────────────────────────────
# 7 blocks × 32 bytes = 224 bytes per trace. Same layout as Rev2.1.
trace_extensions:
  count: 7
  block_size: 32
  blocks:

    # Block 1 — receiver geometry (line / point, sensor type).
    receiver_geometry:
      number: 1
      fields:
        - { name: receiver_line_number,  offset: 0,  length: 3, type: uint24, description: "Receiver line number (integer part). 0xFFFFFF for aux/DSD.", spec_ref: "428XL Vol.2 §1 p.32" }
        - { name: receiver_point_number, offset: 3,  length: 3, type: uint24, description: "Receiver point number (integer part). 0xFFFFFF for aux/DSD.", spec_ref: "428XL Vol.2 §1 p.32" }
        - { name: receiver_point_index,  offset: 6,  length: 1, type: uint8,  description: "Receiver point index",                                       spec_ref: "428XL Vol.2 §1 p.32" }
        - { name: samples_per_trace,     offset: 7,  length: 3, type: uint24, description: "Number of samples per trace (per-trace copy)",                spec_ref: "428XL Vol.2 §1 p.32" }
        - { name: sensor_segd_code,      offset: 20, length: 1, type: uint8,  description: "Sensor SEG-D code: 1=hyd, 2=geo-V, 3-5=geo-H, 6=acc-V, 7-9=acc-H", spec_ref: "428XL Vol.2 §1 p.33" }

    # Block 2 — receiver coordinates (IEEE float, populated by nav system).
    receiver_coords:
      number: 2
      fields:
        - { name: receiver_easting,      offset: 0,  length: 8, type: float64, description: "Receiver easting (metres). Defaults to GUI setup or updated by nav.",   spec_ref: "428XL Vol.2 §1 p.34" }
        - { name: receiver_northing,     offset: 8,  length: 8, type: float64, description: "Receiver northing (metres). Defaults to GUI setup or updated by nav.",  spec_ref: "428XL Vol.2 §1 p.34" }
        - { name: receiver_elevation,    offset: 16, length: 4, type: float32, description: "Receiver elevation (metres). Defaults to GUI setup or updated by nav.", spec_ref: "428XL Vol.2 §1 p.34" }
        - { name: sensor_type_number,    offset: 20, length: 1, type: uint8,  description: "Sensor type number (1-9; survey-defined)",                              spec_ref: "428XL Vol.2 §1 p.34" }
        - { name: extended_trace_number, offset: 28, length: 4, type: uint32, description: "Extended trace number (use when DMUX trace_number=0xFFFF)",             spec_ref: "428XL Vol.2 §1 p.34" }

    # Block 7 — control-unit summary (carries seismic_trace_offset = AOFFSET).
    control_unit:
      number: 7
      fields:
        - { name: channel_type_id,       offset: 14, length: 1, type: uint8,  description: "Channel type id: 1=seis, 9=aux",                                spec_ref: "428XL Vol.2 §1 p.40" }
        - { name: seismic_trace_offset,  offset: 28, length: 4, type: uint32, description: "Seismic trace offset value (= AOFFSET) when removal disabled; 0 otherwise", spec_ref: "428XL Vol.2 §1 p.40" }
